[project]
name = "harbormaster"
version = "0.1.0"
description = "Intelligent file-arrival control for reconciliation"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.17",
    "pyarrow>=18.0",
    "openpyxl>=3.1",
    "lxml>=5.3",
    "rapidfuzz>=3.10",
    "protobuf>=5.28",
    "structlog>=24.4",
    "python-dateutil>=2.9",
    "PyYAML>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Tier 2 embeddings. Optional by design: the local matcher degrades to
# fuzzy-only when this is absent, and records the degradation (ADR-013).
embeddings = ["fastembed>=0.4"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-protobuf>=5.28",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspector", "src/reconstub", "src/harbormaster"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated protobuf code is a build artefact, not source. Formatting it would
# make `make proto` produce a diff on every run and break the staleness gate.
extend-exclude = ["src/harbormaster"]
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
[[tool.mypy.overrides]]
module = ["harbormaster.*", "fastembed.*", "polars.*", "openpyxl.*"]
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
