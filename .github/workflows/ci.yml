name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.47.2

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.2

      - name: Resolve Go modules
        working-directory: go
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: go
          args: --timeout=5m

      - name: Sync Python deps
        working-directory: python
        run: uv sync --group dev

      # CI runs the same target a developer runs. It is never a
      # reimplementation of the gate in YAML, because a reimplementation
      # drifts and then green CI stops meaning anything.
      - name: make check
        run: make check
        env:
          # No API key. The gate must pass with the deterministic adjudicator.
          HM_ADJUDICATOR: fake

      # The results card reads metrics/headline.json. It is regenerated on
      # every push from the same offline replay a developer runs, so a number
      # on the card is always one this pipeline observed.
      - name: make bench
        run: make bench
        env:
          HM_ADJUDICATOR: fake

      - name: Report headline drift
        run: |
          git diff --exit-code -- metrics/headline.json             || echo "::warning::metrics/headline.json differs from the committed numbers; run make bench and commit"

      - name: README results card is current
        run: make card-check
